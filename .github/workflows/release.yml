# Publishes the single-binary harness for every supported platform when a
# version tag is pushed (git tag v1.2.3 && git push origin v1.2.3).
# The command-line binary is pure Go (SQLite is modernc, no CGO), so every
# target is built on one runner. The desktop app needs a native toolchain per
# OS, so it is built on its own runner (macOS .dmg, Linux .tar.gz, Windows
# .zip) and attached to the same release. The macOS app is ad-hoc signed, not
# notarized, and the Windows build is unsigned: both show an OS warning on
# first launch until signing certificates are configured.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tests gate the release
        run: go test ./... -count=1
      - name: build every target
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            name="harness-${version}-${os}-${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            stage="$(mktemp -d)/${name}"; mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X go-sre-harness/internal/app.Version=${version}" \
              -o "$stage/harness${ext}" ./cmd/harness
            cp README.md "$stage/"
            if [ "$os" = windows ]; then
              (cd "$(dirname "$stage")" && zip -qr "$GITHUB_WORKSPACE/dist/${name}.zip" "$name")
            else
              tar -C "$(dirname "$stage")" -czf "dist/${name}.tar.gz" "$name"
            fi
          done
      - name: the linux binary reports its version
        run: |
          tar -xzf "dist/harness-${GITHUB_REF_NAME}-linux-amd64.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/harness-${GITHUB_REF_NAME}-linux-amd64/harness" version | grep -q "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/*

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      DESKTOP_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: build the app (bundles the local harness core)
        run: desktop/build.sh
      - name: package
        run: desktop/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: desktop/dist/*

  publish:
    name: publish release
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* --title "$GITHUB_REF_NAME" --generate-notes
