# Full plugin configuration for the stock binary (cmd/harness).
# Run `harness plugins` to list every compiled-in plugin.
# ${VAR} / ${VAR:-default} are expanded from the environment.
settings:
  model_alias: sre-reasoning   # default alias for strategies
  model_effort: ""             # low|medium|high|xhigh|max

models:
  daily_budget_usd: 50
  max_inflight_per_tenant: 32

strategy:
  default: llm
  aliases: {rule_based_demo: llm}

plugins:
  telemetry: [otlp]                      # OTEL_EXPORTER_OTLP_ENDPOINT enables export
  artifact_store: {name: fs, config: {root: /var/lib/harness/artifacts}}
  broker: {name: nats, config: {url: "${HARNESS_NATS_URL}"}}
  stream_bus: {name: nats, config: {url: "${HARNESS_NATS_URL}"}}
  # Committed run events for SSE; Postgres stays authoritative and is used
  # for every gap and reconnect.
  event_bus: {name: nats, config: {url: "${HARNESS_NATS_URL}", stream: HARNESS_EVENTS, max_age: 1h, max_bytes: 2147483648}}
  policy: {name: default, config: {environment: production, approval_ttl: 30m}}
  # Rule-based policy: the most restrictive matching rule decides; without a
  # match the risk-class engine decides; the framework floor (R2 approval,
  # R3 deny, unregistered tools and missing targets denied) always applies.
  # policy:
  #   name: rules
  #   config:
  #     default_environment: production
  #     approval_ttl: 30m
  #     environments:
  #       - {name: staging, targets: ["*-staging", "staging/*"]}
  #     rules:
  #       - {name: change-freeze, effect: deny, reason: "weekend freeze",
  #          match: {risks: [R1, R2], environments: [production],
  #                  windows: [{days: [fri], start: "18:00", end: "23:59", timezone: "Asia/Shanghai"}]}}
  #       - {name: wide-blast-radius, effect: require_approval, approvals: 2,
  #          match: {blast_radius: {arg: hosts, over: 5}}}
  #       - {name: restart-storm, effect: deny,
  #          match: {labels: {action: restart}, rate: {window: 10m, over: 3, per: target}}}
  #       - {name: sandbox-free, effect: allow, match: {environments: [staging], risks: [R1]}}

  # Environment facts gathered once per run and pinned (untrusted data).
  context_provider: []
  # context_provider:
  #   - {name: dependencies}
  #   - name: static
  #     instance: owners
  #     config: {facts: [{services: ["checkout*"], kind: owner, summary: "team payments, #pay-oncall"}]}
  #   - name: http
  #     instance: changes
  #     config: {http: {url: "http://changes.internal/api/recent?service=${service}&since=${start}",
  #              headers: {Authorization: "Bearer ${env:CHANGES_TOKEN}"}, per_service: true, kind: change}}
  #   - name: tool
  #     instance: deploys
  #     config: {tool: {tool: "k8s.rollout_history", args: {service: "${service}"}, per_service: true, kind: change}}

  model_provider:                        # route preference follows this order
    - {name: anthropic, config: {api_key: "${ANTHROPIC_API_KEY}"}}
    - name: openai
      enabled: false
      config: {base_url: "http://vllm:8000/v1", model: "qwen3-32b"}
    - scripted                           # deterministic fallback

  tools:
    - {name: demo, enabled: false}
    - {name: web, config: {max_bytes: 524288, timeout: 15s}}
    - name: prometheus
      config: {url: "http://prometheus:9090", max_series: 50}
    - name: kubernetes
      config: {in_cluster: true, namespaces: [shop], dry_run: true}
    - name: mcp
      instance: mcp:runbooks
      config:
        name: runbooks
        url: "http://runbooks-mcp:8080/mcp"
        allow: {search: {risk: R0}}

  embedder: hashing
  memory_retriever: {name: hybrid, config: {top_k: 5}}
  strategy: [llm, rule_based]
  grader: substring
  job:
    - {name: consolidator, config: {interval: 10s}}
    - {name: rollout_monitor, config: {interval: 1m}}
    - {name: event_relay, config: {interval: 250ms, batch: 1000, lease_ttl: 15s, start_from: latest}}
    - {name: retention, config: {interval: 5m, outbox_retention: 24h, audit_retention: 2160h, reasoning_retention: 2160h}}
    # Proposes reasoning-layer profile candidates (playbook, excluded patterns)
    # from measured reasoning quality. Never approves, canaries or promotes.
    - name: reasoning_improver
      enabled: false
      config: {interval: 6h, tenants: [default], profile_id: sre-diagnosis, dataset_id: "", window: 168h,
               min_runs: 20, min_uses: 5, retire_below: 0.3}
  authenticator:
    - {name: oidc, config: {issuer: "https://idp.example.com", audience: sre-harness}}
    - {name: token, config: {tokens_file: /etc/harness/tokens.json}}
  api: [memory, eval, extensions, reasoning]

  # Agent profile versions (immutable per version; bump the version to change one).
  profile_source:
    - builtin
    # - {name: file, config: {path: /etc/harness/profiles}}
  # Soft score for model endpoints; hard filters always apply.
  route_policy: priority
  # route_policy: {name: weighted, config: {cost_usd: 100, failures: 20}}
  context_assembler: sectioned
  # context_assembler: {name: sectioned, config: {instructions_file: /etc/harness/instructions.md}}
  compactor: {name: deterministic, config: {keep: 2}}
  # Notifications from the committed event log (at-least-once, de-duplicate on event_id).
  event_sink: []
  # event_sink:
  #   - {name: webhook, instance: slack-approvals, config: {url: "${SLACK_WEBHOOK_URL}", format: slack, types: ["approval.requested", "run.failed"]}}

# Inbound triggers: POST /v1/triggers/{name} (operator role) and schedules.
# Expressions use the flow DSL over payload, item, headers, trigger and now.
