<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRE Harness</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="side-head">
      <div class="brand"><span class="logo">◆</span> SRE Harness</div>
    </div>
    <button id="btn-new" class="new-chat"><span class="plus">＋</span> New chat</button>
    <button id="btn-inbox" class="side-link inbox-link"><span class="side-ico">✓</span> Approvals <span id="inbox-count" class="inbox-count" hidden></span></button>
    <div class="side-search"><input id="chat-search" type="search" placeholder="Search chats" autocomplete="off" spellcheck="false"></div>
    <div class="side-label"><span id="chats-label">Chats</span><button id="btn-archived" class="link-btn tiny">Archived</button></div>
    <ul id="chats" class="chats"></ul>
    <div class="side-foot">
      <button id="btn-customize" class="side-link"><span class="side-ico">⚙</span> Customize</button>
      <button id="btn-plugins" class="side-link"><span class="side-ico">▦</span> Plugins</button>
      <button id="btn-conn" class="side-link who-btn"><span class="avatar-sm" id="who-initial">?</span><span id="who" class="who">Not connected</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="chat-head" id="chat-head"></header>
    <div class="scroll" id="scroll">
      <div class="thread" id="thread"></div>
    </div>
    <div class="composer-wrap" id="composer-wrap">
      <form id="composer" class="composer">
        <div id="slash" class="slash" hidden></div>
        <textarea id="input" rows="1" placeholder="Describe the incident, or ask a follow-up…" spellcheck="false"></textarea>
        <div class="composer-bar">
          <span class="hint" id="hint">Enter to send · Shift+Enter for a new line</span>
          <button type="submit" id="send" class="send" title="Send" disabled>↑</button>
        </div>
      </form>
    </div>
  </main>
</div>

<dialog id="dlg-conn">
  <form id="form-conn" method="dialog">
    <h2>Connection</h2>
    <label>Server URL <input name="server_url" required autocomplete="off" spellcheck="false"></label>
    <div class="seg">
      <label><input type="radio" name="mode" value="dev"> Development headers</label>
      <label><input type="radio" name="mode" value="bearer"> Bearer token</label>
    </div>
    <div class="grid2" data-mode="dev">
      <label>Tenant <input name="tenant" autocomplete="off" spellcheck="false"></label>
      <label>Actor <input name="actor" autocomplete="off" spellcheck="false"></label>
      <label class="span2">Roles <input name="roles" placeholder="viewer, operator, approver, admin" autocomplete="off" spellcheck="false"></label>
    </div>
    <div data-mode="bearer">
      <label>Token <input name="token" type="password" autocomplete="off"></label>
      <p class="muted small">The token stays in memory and is not saved to disk.</p>
    </div>
    <p id="conn-error" class="error" hidden></p>
    <div class="actions">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="submit" class="btn primary">Connect</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-reason">
  <form id="form-reason" method="dialog">
    <h2 id="reason-title">Reason</h2>
    <label>Reason (optional) <textarea name="reason" rows="3"></textarea></label>
    <div class="actions">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="submit" class="btn primary" id="reason-ok">OK</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-ask">
  <form id="form-ask" method="dialog">
    <h2 id="ask-title"></h2>
    <p id="ask-text" class="muted"></p>
    <label id="ask-label" hidden><span id="ask-label-text"></span> <input name="value" autocomplete="off" spellcheck="false"></label>
    <div class="actions">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="submit" class="btn primary" id="ask-ok">OK</button>
    </div>
  </form>
</dialog>

<div id="menu" class="menu" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
